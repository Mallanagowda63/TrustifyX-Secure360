# /etc/nginx/snippets/secure360-tls.conf
# Shared TLS and request settings for both Secure360 server blocks.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_stapling on;
ssl_stapling_verify on;

server_tokens off;
client_max_body_size 256k;
client_body_timeout 15s;
client_header_timeout 15s;

# Security headers are set by the application (next.config.ts); HSTS is repeated here
# so it also covers nginx-generated error pages.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
