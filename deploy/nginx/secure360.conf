# /etc/nginx/sites-available/secure360.conf
# Reverse proxy for the two TrustifyX Secure360 websites, both served by the same app on 127.0.0.1:3000.
# The app tells them apart by the Host header, so `proxy_set_header Host $host` (in the snippet) is required.
#
#   secure360.example.com  marketing, pricing, signup, Razorpay checkout, account/billing   (APP_URL)
#   portal.example.com     login-only customer security portal                             (PORTAL_URL)
#
# Replace both names, then obtain certificates:
#   sudo certbot certonly --nginx -d secure360.example.com -d portal.example.com

# Rate-limit zones (per client IP). The application also rate-limits auth endpoints.
limit_req_zone $binary_remote_addr zone=tx_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tx_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name secure360.example.com portal.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# Website 1: marketing and purchase site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name secure360.example.com;

    ssl_certificate     /etc/letsencrypt/live/secure360.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/secure360.example.com/privkey.pem;
    include /etc/nginx/snippets/secure360-tls.conf;

    location ~ ^/(api/auth|api/invitations|sso)/ {
        limit_req zone=tx_auth burst=10 nodelay;
        include /etc/nginx/snippets/secure360-proxy.conf;
    }

    # Razorpay webhook: signature-verified by the app over the raw body.
    location = /api/webhooks/razorpay {
        client_max_body_size 1m;
        include /etc/nginx/snippets/secure360-proxy.conf;
    }

    location /api/ {
        limit_req zone=tx_api burst=40 nodelay;
        include /etc/nginx/snippets/secure360-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/secure360-proxy.conf;
    }
}

# Website 2: customer security portal (login-only)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portal.example.com;

    ssl_certificate     /etc/letsencrypt/live/secure360.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/secure360.example.com/privkey.pem;
    include /etc/nginx/snippets/secure360-tls.conf;

    # The portal is private: keep it out of search engines (the app also sends noindex metadata).
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~ ^/(api/auth|sso)/ {
        limit_req zone=tx_auth burst=10 nodelay;
        include /etc/nginx/snippets/secure360-proxy.conf;
    }

    # Payment webhooks are only accepted on the marketing host.
    location /api/webhooks/ { return 404; }

    location /api/ {
        limit_req zone=tx_api burst=40 nodelay;
        include /etc/nginx/snippets/secure360-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/secure360-proxy.conf;
    }
}
