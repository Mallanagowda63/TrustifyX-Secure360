# /etc/nginx/sites-available/secure360.conf
# Reverse proxy for TrustifyX Secure360. Replace app.example.com with your domain,
# then obtain a certificate: sudo certbot --nginx -d app.example.com

# Rate-limit zones (per client IP). The application also rate-limits auth endpoints.
limit_req_zone $binary_remote_addr zone=tx_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tx_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;
    client_max_body_size 256k;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Security headers are set by the application (next.config.ts); HSTS is repeated here
    # so it also covers nginx-generated error pages.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location ~ ^/api/(auth|invitations)/ {
        limit_req zone=tx_auth burst=10 nodelay;
        include /etc/nginx/snippets/secure360-proxy.conf;
    }

    location /api/ {
        limit_req zone=tx_api burst=40 nodelay;
        include /etc/nginx/snippets/secure360-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/secure360-proxy.conf;
    }
}
